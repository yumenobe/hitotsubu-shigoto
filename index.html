<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>ひとつぶタスク しごと版</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    -webkit-tap-highlight-color:transparent;
    --base:#EBEEF0; --surface:#FFFFFF; --ink:#22303C; --ink-soft:#5D6E7A;
    --card:#2C4A5E; --card-done:#3E6B4F; --accent:#2C4A5E; --accent-ink:#FFFFFF;
    --dot:#C3CDD3; --dot-active:#2C4A5E;
    --line:rgba(34,48,60,.16); --field:#FFFFFF; --field-ink:#22303C;
    --danger:#B3261E;
    background:var(--base); color:var(--ink);
  }
  @media (prefers-color-scheme: dark){
    body{
      --base:#161D23; --surface:#212B33; --ink:#E8EEF1; --ink-soft:#9DB0BC;
      --card:#35617C; --card-done:#41755A; --accent:#7FB0C9; --accent-ink:#14222B;
      --dot:#3A4750; --dot-active:#7FB0C9;
      --line:rgba(232,238,241,.18); --field:#1C262E; --field-ink:#E8EEF1;
      --danger:#F2A49E;
    }
  }
  button{font:inherit;cursor:pointer}
  button:focus-visible,[tabindex]:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .hidden{display:none !important}

  /* ===== 紙芝居（スクロールなし） ===== */
  .deck{
    height:100dvh; max-height:100dvh; overflow:hidden;
    display:flex; flex-direction:column;
    padding:8px 20px calc(10px + env(safe-area-inset-bottom));
    max-width:560px; margin:0 auto; width:100%;
  }
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:10px; flex:0 0 auto}
  .count{font-size:20px; font-weight:700; letter-spacing:.02em; min-width:64px}
  .top-actions{display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end}
  .ghost-btn{
    min-height:44px; padding:9px 16px; border-radius:999px;
    border:1.5px solid var(--ink-soft); background:transparent; color:var(--ink);
    font-size:15px; font-weight:700; display:inline-flex; align-items:center; gap:6px;
  }
  .ghost-btn:active{transform:scale(.98)}
  .list-chip-row{display:flex; justify-content:center; margin-top:24px; flex:0 0 auto}
  .list-chip{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--surface); border:1.5px solid var(--line);
    border-radius:999px; padding:10px 22px; min-height:48px;
    font-size:18px; font-weight:800; color:var(--ink);
    box-shadow:0 2px 10px rgba(0,0,0,.05);
  }
  .list-chip .chip-dot{width:10px; height:10px; border-radius:999px; background:var(--card); flex:0 0 auto}
  @media (prefers-color-scheme: dark){ .list-chip .chip-dot{background:var(--accent)} }
  .card-zone{flex:1 1 auto; display:flex; align-items:center; justify-content:center; min-height:0; padding:10px 0 4px}
  .card{
    width:100%; height:40dvh; min-height:250px; max-height:460px;
    border:0; border-radius:34px; background:var(--card); color:#fff;
    display:flex; flex-direction:column; align-items:center; justify-content:space-between;
    padding:26px 22px 24px; text-align:center; position:relative;
    box-shadow:0 14px 28px rgba(20,35,45,.18), 0 6px 0 rgba(0,0,0,.05);
  }
  .card:active{transform:scale(.995)}
  .card-label{font-size:15px; font-weight:700; letter-spacing:.14em; opacity:.92}
  .card-task{font-size:clamp(34px,9vw,52px); font-weight:800; line-height:1.35; word-break:break-word; padding:0 4px}
  .card-hint{font-size:17px; font-weight:700; opacity:.95; display:flex; align-items:center; gap:4px}
  .card-done{background:var(--card-done)}
  .dots{display:flex; justify-content:center; gap:10px; margin-top:8px; flex:0 0 auto; flex-wrap:wrap; padding:0 8px}
  .dot{width:11px; height:11px; border-radius:999px; background:var(--dot); transition:all .2s}
  .dot.done{background:var(--dot-active); opacity:.55}
  .dot.now{width:30px; background:var(--dot-active); opacity:1}
  .back-row{margin-top:20px; flex:0 0 auto}
  .back-btn{
    min-height:48px; border:0; background:transparent; color:var(--ink);
    font-size:18px; font-weight:700; display:inline-flex; align-items:center; gap:8px; padding:10px 12px 10px 2px;
  }
  .back-btn:disabled{opacity:.35}
  .saved-note{text-align:center; font-size:12px; color:var(--ink-soft); margin-top:2px; flex:0 0 auto; line-height:1.5}

  /* ===== サブ画面（一覧・編集） ===== */
  .view{min-height:100dvh; max-width:560px; margin:0 auto; padding:14px 20px calc(28px + env(safe-area-inset-bottom))}
  .view-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:6px}
  .view-title{font-size:21px; font-weight:800; margin:0}
  .view-sub{font-size:13.5px; color:var(--ink-soft); margin:2px 0 14px; line-height:1.7}
  .list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px}
  .list-item{
    width:100%; text-align:left; border:1.5px solid var(--line); background:var(--surface);
    border-radius:16px; padding:14px 16px; min-height:56px;
    display:flex; align-items:center; gap:12px; font-size:17px; font-weight:700; color:var(--ink);
  }
  .list-item .num{font-size:13px; color:var(--ink-soft); min-width:22px}
  .list-item .name{flex:1; word-break:break-word}
  .badge{font-size:12px; font-weight:800; background:var(--card); color:#fff; border-radius:999px; padding:4px 10px; white-space:nowrap}
  @media (prefers-color-scheme: dark){ .badge{background:var(--accent); color:var(--accent-ink)} }
  .check{width:26px; height:26px; border-radius:50%; background:var(--card-done); color:#fff; display:inline-flex; align-items:center; justify-content:center; font-size:15px; flex:0 0 auto}
  .list-item.is-now{border-color:var(--accent); box-shadow:0 0 0 1.5px var(--accent) inset}
  .list-item.is-done{opacity:.72}
  .primary-btn{
    min-height:50px; border:0; border-radius:999px; background:var(--card); color:#fff;
    font-size:16px; font-weight:800; padding:12px 22px; width:100%;
  }
  @media (prefers-color-scheme: dark){ .primary-btn{background:var(--accent); color:var(--accent-ink)} }
  .sticky-bottom{position:sticky; bottom:10px; margin-top:18px}

  /* ===== 編集（プレーンテキスト） ===== */
  .field-label{font-size:14px; font-weight:800; margin:18px 0 8px; display:block}
  .field-label:first-of-type{margin-top:4px}
  textarea{
    width:100%; border:1.5px solid var(--line); border-radius:14px;
    background:var(--field); color:var(--field-ink);
    font-family:inherit; font-size:16px; line-height:1.7;
    padding:12px 14px; resize:vertical;
  }
  textarea::placeholder{color:var(--ink-soft)}
  #bulkText{min-height:180px}
  #allText{min-height:220px}
  .bulk-row{display:flex; gap:8px; margin-top:10px; align-items:stretch}
  .add-btn{
    min-height:50px; border:0; border-radius:14px; background:var(--card); color:#fff;
    font-weight:800; padding:10px 18px; font-size:16px; flex:1;
  }
  @media (prefers-color-scheme: dark){ .add-btn{background:var(--accent); color:var(--accent-ink)} }
  .add-note{font-size:12.5px; color:var(--ink-soft); margin-top:8px; line-height:1.6}
  .save-status{font-size:13px; font-weight:700; color:var(--card-done); min-height:20px; margin-top:10px}
  .tool-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:22px}
  .tool-btn{
    min-height:46px; border:1.5px solid var(--line); background:var(--surface); color:var(--ink);
    border-radius:999px; padding:9px 16px; font-size:14px; font-weight:700;
    display:inline-flex; align-items:center;
  }
  .danger{color:var(--danger)}
  .divider{border:0; border-top:1.5px solid var(--line); margin:26px 0 0}
  @media (max-height:640px){ .card{height:auto; flex:1 1 auto; max-height:none} }
  @media (prefers-reduced-motion:reduce){ *{transition:none !important} }
</style>
</head>
<body>

  <!-- ===== 紙芝居 ===== -->
  <main class="deck" id="deckView" aria-label="紙芝居">
    <div class="topbar">
      <div class="count" id="countLabel">0 / 0</div>
      <div class="top-actions">
        <button class="ghost-btn" id="openListBtn" type="button">☰ 一覧で確認</button>
        <button class="ghost-btn" id="openEditBtn" type="button">✎ タスクを編集</button>
      </div>
    </div>

    <div class="list-chip-row">
      <div class="list-chip"><span class="chip-dot" aria-hidden="true"></span>しごと</div>
    </div>

    <div class="card-zone">
      <button class="card" id="cardBtn" type="button" aria-live="polite">
        <span class="card-label" id="cardLabel">タスクがありません</span>
        <span class="card-task" id="cardTask">編集から追加してね</span>
        <span class="card-hint" id="cardHint">タスクを編集へ ›</span>
      </button>
    </div>

    <div class="dots" id="dots" aria-hidden="true"></div>

    <div class="back-row">
      <button class="back-btn" id="backBtn" type="button">← もどる</button>
    </div>
    <div class="saved-note">この端末に自動保存中 ・ 日付が変わっても進捗はそのまま残ります</div>
  </main>

  <!-- ===== 一覧 ===== -->
  <section class="view hidden" id="listView" aria-label="一覧で確認">
    <div class="view-head">
      <h2 class="view-title">しごとの一覧</h2>
      <button class="ghost-btn" id="listCloseBtn" type="button">✕ 閉じる</button>
    </div>
    <p class="view-sub">タスクをタップすると、そのタスクから紙芝居を再開できます。</p>
    <ul class="list" id="overviewList"></ul>
    <div class="tool-row">
      <button class="tool-btn" id="restartBtn" type="button">進捗を最初に戻す</button>
    </div>
    <div class="sticky-bottom"><button class="primary-btn" id="backToDeckBtn" type="button">紙芝居にもどる</button></div>
  </section>

  <!-- ===== 編集 ===== -->
  <section class="view hidden" id="editView" aria-label="タスクを編集">
    <div class="view-head">
      <h2 class="view-title">しごとのタスクを編集</h2>
      <button class="ghost-btn" id="editCloseBtn" type="button">✕ 閉じる</button>
    </div>
    <p class="view-sub">タスクはプレーンテキストで編集できます。1行が1タスクです。</p>

    <label class="field-label" for="bulkText">まとめて追加</label>
    <textarea id="bulkText" placeholder="1行に1タスクずつ書いてね&#10;例：&#10;見積書を送る&#10;会議の資料を作る&#10;メールに返信する"></textarea>
    <div class="bulk-row">
      <button class="add-btn" id="bulkAddBtn" type="button">この行を全部追加する</button>
    </div>
    <p class="add-note">空行は無視して、書いた順に末尾へ追加します。追加すると下の「全部のタスク」にも反映されます。</p>

    <hr class="divider" />

    <label class="field-label" for="allText">全部のタスク（1行＝1タスク）</label>
    <textarea id="allText" placeholder="まだタスクがありません。上の「まとめて追加」から入れてね"></textarea>
    <p class="add-note">行を書き換えると内容の変更、行を消すと削除、行の順を入れ替えると並び替えになります。</p>
    <div class="bulk-row">
      <button class="add-btn" id="saveAllBtn" type="button">この内容で保存する</button>
    </div>
    <div class="save-status" id="saveStatus" role="status"></div>

    <div class="tool-row">
      <button class="tool-btn" id="exportBtn" type="button">⬇ ファイルに書き出し</button>
      <label class="tool-btn" for="importFile" style="cursor:pointer">⬆ ファイルから読み込み</label>
      <input id="importFile" type="file" accept=".json,application/json" class="hidden" />
      <button class="tool-btn danger" id="clearBtn" type="button">タスクを全部消す</button>
    </div>
    <div class="sticky-bottom"><button class="primary-btn" id="editDoneBtn" type="button">紙芝居にもどる</button></div>
  </section>

<script>
(function(){
  "use strict";
  var KEY = "hitotsubu-shigoto-v1";

  function defaultState(){ return { tasks: [], index: 0 }; }
  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(!raw) return defaultState();
      var s = JSON.parse(raw);
      if(!s || !Array.isArray(s.tasks)) return defaultState();
      s.tasks = s.tasks.map(String).filter(function(t){ return t.trim() !== ""; });
      if(typeof s.index !== "number" || s.index < 0) s.index = 0;
      if(s.index > s.tasks.length) s.index = s.tasks.length;
      return s;
    }catch(e){ return defaultState(); }
  }
  // しごと版は日付リセットなし：読み込み時に進捗は一切リセットしない
  var state = load();
  var view = "deck"; // deck | list | edit

  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
  function clamp(){ if(state.index < 0) state.index = 0; if(state.index > state.tasks.length) state.index = state.tasks.length; }

  var $ = function(id){ return document.getElementById(id); };
  var deckView=$("deckView"), listView=$("listView"), editView=$("editView");
  var countLabel=$("countLabel"), cardBtn=$("cardBtn"), cardLabel=$("cardLabel"),
      cardTask=$("cardTask"), cardHint=$("cardHint"), dotsEl=$("dots"), backBtn=$("backBtn");

  function showView(v){
    view = v;
    deckView.classList.toggle("hidden", v!=="deck");
    listView.classList.toggle("hidden", v!=="list");
    editView.classList.toggle("hidden", v!=="edit");
    if(v==="list") renderList();
    if(v==="edit") renderEdit();
    window.scrollTo(0,0);
  }

  /* ===== 紙芝居 ===== */
  function renderDeck(){
    clamp();
    var list = state.tasks, total = list.length, idx = state.index;
    if(total===0){
      countLabel.textContent = "0 / 0";
      cardLabel.textContent = "タスクがありません";
      cardTask.textContent = "編集から追加してね";
      cardHint.textContent = "タスクを編集へ ›";
      cardBtn.classList.remove("card-done");
      dotsEl.innerHTML = ""; backBtn.disabled = true; return;
    }
    var done = idx >= total;
    countLabel.textContent = Math.min(idx+1, total) + " / " + total;
    if(done){
      cardLabel.textContent = "おつかれさま";
      cardTask.textContent = "全部できた！";
      cardHint.textContent = "タップでもう一度はじめから";
      cardBtn.classList.add("card-done");
    }else{
      cardLabel.textContent = "いまのタスク";
      cardTask.textContent = list[idx];
      cardHint.innerHTML = "できたらタップ <span aria-hidden='true'>›</span>";
      cardBtn.classList.remove("card-done");
    }
    var html = "";
    for(var i=0;i<total;i++){
      var cls = "dot" + (done || i < idx ? " done" : "") + (!done && i===idx ? " now" : "");
      html += "<span class='"+cls+"'></span>";
    }
    dotsEl.innerHTML = html;
    backBtn.disabled = idx <= 0;
  }
  function advance(){
    if(state.tasks.length===0){ showView("edit"); return; }
    if(state.index >= state.tasks.length){ state.index = 0; }
    else { state.index += 1; }
    save(); renderDeck();
  }
  function goBack(){ if(state.index > 0){ state.index -= 1; save(); renderDeck(); } }

  /* ===== 一覧 ===== */
  function renderList(){
    var ul = $("overviewList"); ul.innerHTML = "";
    var list = state.tasks, idx = state.index;
    if(list.length===0){
      ul.innerHTML = "<li class='list-item'><span class='name'>タスクがありません</span></li>"; return;
    }
    list.forEach(function(name, i){
      var isDone = i < idx, isNow = i === idx;
      var li = document.createElement("li");
      var btn = document.createElement("button"); btn.type = "button";
      btn.className = "list-item" + (isNow ? " is-now" : "") + (isDone ? " is-done" : "");
      btn.innerHTML = (isDone ? "<span class='check'>✓</span>" : "<span class='num'>"+(i+1)+"</span>")
        + "<span class='name'></span>" + (isNow ? "<span class='badge'>いまここ</span>" : "");
      btn.querySelector(".name").textContent = name;
      btn.addEventListener("click", function(){ state.index = i; save(); showView("deck"); renderDeck(); });
      li.appendChild(btn); ul.appendChild(li);
    });
  }

  /* ===== 編集（プレーンテキスト） ===== */
  function parseLines(text){
    return String(text).split(/\r?\n/).map(function(s){ return s.trim(); }).filter(function(s){ return s !== ""; });
  }
  function renderEdit(){
    $("allText").value = state.tasks.join("\n");
    $("saveStatus").textContent = "";
  }
  function setStatus(msg){ $("saveStatus").textContent = msg; }

  function bulkAdd(){
    var lines = parseLines($("bulkText").value);
    if(lines.length===0){ setStatus("追加するタスクが書かれていません"); return; }
    state.tasks = state.tasks.concat(lines);
    clamp(); save();
    $("bulkText").value = "";
    $("allText").value = state.tasks.join("\n");
    setStatus(lines.length + "件を追加しました（全" + state.tasks.length + "件）");
    renderDeck();
  }
  function saveAll(){
    var lines = parseLines($("allText").value);
    state.tasks = lines;
    clamp(); save();
    $("allText").value = state.tasks.join("\n");
    setStatus("保存しました（全" + state.tasks.length + "件）。進捗はそのまま残っています");
    renderDeck();
  }

  /* ===== イベント ===== */
  cardBtn.addEventListener("click", advance);
  backBtn.addEventListener("click", goBack);
  $("openListBtn").addEventListener("click", function(){ showView("list"); });
  $("openEditBtn").addEventListener("click", function(){ showView("edit"); });
  $("listCloseBtn").addEventListener("click", function(){ showView("deck"); renderDeck(); });
  $("backToDeckBtn").addEventListener("click", function(){ showView("deck"); renderDeck(); });
  $("editCloseBtn").addEventListener("click", function(){ showView("deck"); renderDeck(); });
  $("editDoneBtn").addEventListener("click", function(){ showView("deck"); renderDeck(); });
  $("restartBtn").addEventListener("click", function(){ state.index = 0; save(); renderList(); renderDeck(); });
  $("bulkAddBtn").addEventListener("click", bulkAdd);
  $("saveAllBtn").addEventListener("click", saveAll);
  $("clearBtn").addEventListener("click", function(){
    state.tasks = []; state.index = 0; save();
    $("allText").value = ""; $("bulkText").value = "";
    setStatus("タスクを全部消しました");
    renderDeck();
  });
  $("exportBtn").addEventListener("click", function(){
    var data = JSON.stringify({ tasks: state.tasks }, null, 2);
    var blob = new Blob([data], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a"); a.href = url; a.download = "hitotsubu-shigoto-tasks.json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  });
  $("importFile").addEventListener("change", function(e){
    var file = e.target.files && e.target.files[0]; if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var parsed = JSON.parse(String(reader.result));
        var t = parsed.tasks || parsed;
        if(Array.isArray(t)){
          state.tasks = t.map(String).filter(function(s){ return s.trim() !== ""; });
          state.index = 0; save();
          $("allText").value = state.tasks.join("\n");
          setStatus("読み込みました（全" + state.tasks.length + "件）");
          renderDeck();
        }
      }catch(err){}
      e.target.value = "";
    };
    reader.readAsText(file);
  });

  renderDeck();
})();
</script>
</body>
</html>
